model: anthropic/claude-opus-4
label:
  en_US: "Anthropic: Claude Opus 4"
  zh_Hans: "Anthropic: Claude Opus 4"
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - document
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: temperature
    use_template: temperature
    min: 0
    max: 1
    default: 1
  - name: top_p
    use_template: top_p
  - name: top_k
    label:
      zh_Hans: 取样数量
      en_US: Top K
    type: int
    required: false
    help:
      zh_Hans: 仅从每个后续 token 的前 K 个选项中采样。
      en_US: Only sample from the top K options for each subsequent token.
  - name: enable_thinking
    type: boolean
    required: true
    default: false
    label:
      zh_Hans: 推理模式
      en_US: Thinking Mode
    help:
      zh_Hans: 控制模型的推理能力。启用时，temperature、top_p 和 top_k 将被禁用。
      en_US: Controls the model's thinking capability. When enabled, temperature, top_p and top_k will be disabled.
  - name: exclude_reasoning_tokens
    type: boolean
    required: true
    default: true
    label:
      zh_Hans: 隐藏思考过程
      en_US: Hide the thought process
    help:
      zh_Hans: 是否隐藏思考过程。
      en_US: Whether to hide the thought process.
  - name: reasoning_budget
    type: int
    required: true
    default: 2000
    min: 1024
    max: 30000
    label:
      en_US: Thinking Budget
      zh_Hans: 推理预算
    help:
      en_US: The budget limit for thinking (minimum 1024), must be less than max_tokens. Only valid in thinking mode.
      zh_Hans: 推理的预算限制（最小1024），必须小于max_tokens。仅在推理模式时有效。
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 16000
    min: 1
    max: 32000
  - name: response_format
    use_template: response_format
pricing:
  input: "15.00"
  output: "75.00"
  unit: "0.000001"
  currency: USD
