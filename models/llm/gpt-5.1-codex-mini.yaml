model: openai/gpt-5.1-codex-mini
label:
  en_US: "OpenAI: GPT-5.1 Codex Mini"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - agent-thought
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 400000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 32768
    min: 1
    max: 128000
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: reasoning_effort
    label:
      zh_Hans: 推理程度
      en_US: Reasoning Effort
    type: string
    help:
      zh_Hans: 指定模型推理的难度
      en_US: specifying the difficulty of the model's reasoning
    required: false
    options:
      - high
      - medium
      - low
      - minimal
  - name: verbosity
    label:
      zh_Hans: 回复详细度
      en_US: Verbosity
    required: false
    type: string
    help:
      zh_Hans: "控制模型响应的详细程度和长度。"
      en_US: "Controls the verbosity and length of the model response."
    options:
      - low
      - medium
      - high
  - name: exclude_reasoning_tokens
    label:
      zh_Hans: 隐藏思考过程
      en_US: Hide the thought process
    type: boolean
    default: false
    help:
      zh_Hans: 是否隐藏思考过程。
      en_US: Whether to hide the thought process.
    required: false
pricing:
  input: '0.25'
  output: '2.00'
  unit: '0.000001'
  currency: USD
