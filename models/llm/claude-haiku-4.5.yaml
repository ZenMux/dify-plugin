model: anthropic/claude-haiku-4.5
label:
  zh_Hans: "Anthropic: Claude Haiku 4.5"
  en_US: "Anthropic: Claude Haiku 4.5"
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: temperature
    use_template: temperature
    min: 0
    max: 1
    default: 1
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 64000
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
  - name: enable_thinking
    type: boolean
    required: true
    default: false
    label:
      zh_Hans: 推理模式
      en_US: Thinking Mode
    help:
      zh_Hans: 控制模型的推理能力。启用时，temperature、top_p 和 top_k 将被禁用。
      en_US: Controls the model's thinking capability. When enabled, temperature, top_p and top_k will be disabled.
  - name: reasoning_budget
    type: int
    required: true
    default: 2000
    min: 1024
    max: 60000
    label:
      en_US: Reasoning budget
      zh_Hans: 思考预算
    help:
      en_US: Reasoning budget, in tokens
      zh_Hans: 思考预算，单位为 token
  - name: exclude_reasoning_tokens
    type: boolean
    required: true
    default: true
    label:
      zh_Hans: 隐藏思考过程
      en_US: Hide the thought process
    help:
      zh_Hans: 是否隐藏思考过程。
      en_US: Whether to hide the thought process.
pricing:
  input: '1.00'
  output: '5.00'
  unit: '0.000001'
  currency: USD
