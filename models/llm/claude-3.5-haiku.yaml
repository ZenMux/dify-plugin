model: anthropic/claude-3.5-haiku
label:
  en_US: "Anthropic: Claude 3.5 Haiku"
  zh_Hans: "Anthropic: Claude 3.5 Haiku"
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: temperature
    use_template: temperature
    min: 0
    max: 1
    default: 1
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 8192
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
pricing:
  input: '0.80'
  output: '4.00'
  unit: '0.000001'
  currency: USD
