model: inclusionai/ling-2.6-flash
label:
  en_US: 'InclusionAI: Ling 2.6 Flash'
  zh_Hans: 'InclusionAI: Ling 2.6 Flash'
model_type: llm
features:
- tool-call
- multi-tool-call
- agent-thought
- stream-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  required: true
  default: 4096
  min: 1
  max: 262144
- name: response_format
  label:
    zh_Hans: 回复格式
    en_US: Response Format
  type: string
  help:
    zh_Hans: 指定模型必须输出的格式
    en_US: specifying the format that the model must output
  required: false
  options:
  - text
  - json_object
pricing:
  input: '0.1'
  output: '0.3'
  unit: '0.000001'
  currency: USD
