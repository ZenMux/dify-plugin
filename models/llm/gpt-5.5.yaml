# Generated by scripts/zenmux_models.py - edit catalog/overrides.yaml instead.
model: openai/gpt-5.5
label:
  en_US: 'OpenAI: GPT-5.5'
  zh_Hans: 'OpenAI: GPT-5.5'
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- vision
- document
model_properties:
  mode: chat
  context_size: 1050000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: presence_penalty
  use_template: presence_penalty
- name: frequency_penalty
  use_template: frequency_penalty
- name: max_tokens
  use_template: max_tokens
  required: true
  default: 8192
  min: 1
  max: 128000
- name: response_format
  label:
    en_US: Response Format
    zh_Hans: 回复格式
  type: string
  help:
    en_US: specifying the format that the model must output
    zh_Hans: 指定模型必须输出的格式
  required: false
  options:
  - text
  - json_object
  - json_schema
- name: json_schema
  use_template: json_schema
- name: reasoning_effort
  label:
    en_US: Reasoning Effort
    zh_Hans: 推理程度
  type: string
  help:
    en_US: Constrains effort on reasoning.
    zh_Hans: 指定模型推理的程度
  required: false
  options:
  - none
  - low
  - medium
  - high
  - xhigh
- name: verbosity
  label:
    en_US: Verbosity
    zh_Hans: 回复详细度
  type: string
  help:
    en_US: Controls the verbosity and length of the model response.
    zh_Hans: 控制模型响应的详细程度和长度。
  required: false
  options:
  - low
  - medium
  - high
- name: exclude_reasoning_tokens
  type: boolean
  required: false
  default: false
  label:
    en_US: Hide the thought process
    zh_Hans: 隐藏思考过程
  help:
    en_US: Drop the streamed thought process from the output.
    zh_Hans: 不在输出中展示思考过程。
pricing:
  input: '5'
  output: '30'
  unit: '0.000001'
  currency: USD
