- name: top_p
  use_template: top_p
- name: top_k
  type: int
  required: false
  label:
    en_US: Top k
    zh_Hans: 取样数量
  help:
    en_US: Only sample from the top K options for each subsequent token.
    zh_Hans: 仅从每个后续标记的前 K 个选项中采样。
- name: max_output_tokens
  use_template: max_tokens
  required: true
  default: 8192
  min: 1
  max: 65535
- name: include_thoughts
  type: boolean
  required: false
  default: false
  label:
    en_US: Include thoughts
    zh_Hans: 返回思考过程
  help:
    en_US: Whether to include thoughts in the response.
    zh_Hans: 是否返回思考过程。
- name: thinking_level
  type: string
  required: false
  options:
  - Low
  - High
  label:
    en_US: Thinking level
    zh_Hans: 思考层级
  help:
    en_US: Thinking depth; model default when unset.
    zh_Hans: 思考深度，不设置时使用模型默认值。
- name: media_resolution
  type: string
  required: false
  options:
  - Default
  - Low
  - Medium
  - High
  label:
    en_US: Media resolution
    zh_Hans: 媒体分辨率
  help:
    en_US: Visual processing quality; higher costs more tokens.
    zh_Hans: 多模态视觉处理质量，越高越耗 token。
- name: grounding
  type: boolean
  required: false
  default: false
  label:
    en_US: Grounding
    zh_Hans: 事实核查
  help:
    en_US: Grounding with Google Search
    zh_Hans: Google 事实核查
- name: url_context
  type: boolean
  required: false
  default: false
  label:
    en_US: URL context
    zh_Hans: 链接详情
  help:
    en_US: Browse the url context
    zh_Hans: 获取并分析链接的详细信息，为回答提供参考依据。
- name: code_execution
  type: boolean
  required: false
